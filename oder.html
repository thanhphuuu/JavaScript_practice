<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MY FUTURE</title>
</head>
<body>
    <button onclick="addItem('coffee')">Coffee</button>
    <button onclick="addItem('bagels')">Bagels</button>
    <button onclick="addItem('soup')">Soup</button>
    <button onclick="calcCost()">Cost</button>

    <script>
        const menu = {
            coffee: { price: 5, quantity: 0 },
            bagels: { price: 3, quantity: 0 },
            soup:   { price: 9, quantity: 0 },
        };

        function addItem(item) {
            menu[item].quantity += 1;
            console.log(`Quantity ${item}: ${menu[item].quantity}`);
        }

        function calcCost() {
            const total = Object.values(menu).reduce(
                (sum, item) => sum + item.price * item.quantity, 0
            );
            console.log(`Total cost: ${total}`);
        }
    </script>
</body>
</html>
